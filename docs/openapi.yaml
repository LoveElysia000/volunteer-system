components:
    schemas:
        activity.ActivityCancelRequest:
            type: object
            properties:
                activityId:
                    type: string
                    description: '活动ID 必填 @gotags: json:"activityId,required"'
        activity.ActivityCancelResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: 取消成功
        activity.ActivityCheckInRequest:
            type: object
            properties:
                activityId:
                    type: string
                    description: '活动ID 必填 @gotags: json:"activityId,required"'
                checkInCode:
                    type: string
                    description: '签到码 必填 @gotags: json:"checkInCode,required"'
        activity.ActivityCheckInResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: 是否成功
                checkInTime:
                    type: string
                    description: 签到时间
        activity.ActivityCheckOutRequest:
            type: object
            properties:
                activityId:
                    type: string
                    description: '活动ID 必填 @gotags: json:"activityId,required"'
                checkOutCode:
                    type: string
                    description: '签退码 必填 @gotags: json:"checkOutCode,required"'
        activity.ActivityCheckOutResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: 是否成功
                checkOutTime:
                    type: string
                    description: 签退时间
                grantedHours:
                    type: number
                    description: 本次发放工时
                    format: double
        activity.ActivityDetailResponse:
            type: object
            properties:
                activity:
                    $ref: '#/components/schemas/activity.ActivityInfo'
        activity.ActivityInfo:
            type: object
            properties:
                id:
                    type: string
                orgId:
                    type: string
                    description: 组织ID
                orgName:
                    type: string
                    description: 组织名称
                title:
                    type: string
                    description: 活动标题
                description:
                    type: string
                    description: 活动描述
                coverUrl:
                    type: string
                    description: 封面图URL
                startTime:
                    type: string
                    description: 开始时间
                endTime:
                    type: string
                    description: 结束时间
                location:
                    type: string
                    description: 地点名称
                address:
                    type: string
                    description: 详细地址
                duration:
                    type: number
                    description: 预估工时
                    format: double
                maxPeople:
                    type: integer
                    description: 最大招募人数
                    format: int32
                currentPeople:
                    type: integer
                    description: 当前已报名人数
                    format: int32
                status:
                    type: integer
                    description: '状态: 1-报名中, 2-已结束, 3-已取消'
                    format: int32
                isRegistered:
                    type: boolean
                    description: 是否已报名 (当前用户)
                createdAt:
                    type: string
                    description: 创建时间
                checkInStatus:
                    type: integer
                    description: '签到状态: 0-未签到, 1-已签到'
                    format: int32
                checkInTime:
                    type: string
                    description: 签到时间
                checkOutStatus:
                    type: integer
                    description: '签退状态: 0-未签退, 1-已签退'
                    format: int32
                checkOutTime:
                    type: string
                    description: 签退时间
                workHourStatus:
                    type: integer
                    description: '工时结算状态: 0-未结算, 1-已发放, 2-已作废'
                    format: int32
                grantedHours:
                    type: number
                    description: 本次发放工时
                    format: double
        activity.ActivityItem:
            type: object
            properties:
                id:
                    type: string
                title:
                    type: string
                    description: 活动标题
                description:
                    type: string
                    description: 活动描述
                coverUrl:
                    type: string
                    description: 封面图URL
                startTime:
                    type: string
                    description: 开始时间
                endTime:
                    type: string
                    description: 结束时间
                location:
                    type: string
                    description: 地点名称
                duration:
                    type: number
                    description: 预估工时
                    format: double
                maxPeople:
                    type: integer
                    description: 最大招募人数
                    format: int32
                currentPeople:
                    type: integer
                    description: 当前已报名人数
                    format: int32
                status:
                    type: integer
                    description: '状态: 1-报名中, 2-已结束, 3-已取消'
                    format: int32
                isRegistered:
                    type: boolean
                    description: 是否已报名 (当前用户)
                isFull:
                    type: boolean
                    description: 是否已满员
        activity.ActivityListRequest:
            type: object
            properties:
                page:
                    type: integer
                    description: '页码 可选 @gotags: json:"page"'
                    format: int32
                pageSize:
                    type: integer
                    description: '页大小 可选 @gotags: json:"pageSize"'
                    format: int32
                status:
                    type: integer
                    description: '状态筛选 可选 @gotags: json:"status"'
                    format: int32
                keyword:
                    type: string
                    description: '关键词（标题/描述/地点） 可选 @gotags: json:"keyword"'
                startFrom:
                    type: string
                    description: '开始时间起始 可选 @gotags: json:"startFrom"'
                startTo:
                    type: string
                    description: '开始时间结束 可选 @gotags: json:"startTo"'
                sortBy:
                    type: string
                    description: '排序字段：start_time/created_at 可选 @gotags: json:"sortBy"'
                sortOrder:
                    type: string
                    description: '排序方向：asc/desc 可选 @gotags: json:"sortOrder"'
        activity.ActivityListResponse:
            type: object
            properties:
                total:
                    type: integer
                    format: int32
                list:
                    type: array
                    items:
                        $ref: '#/components/schemas/activity.ActivityItem'
        activity.ActivitySignupRequest:
            type: object
            properties:
                activityId:
                    type: string
                    description: '活动ID 必填 @gotags: json:"activityId,required"'
        activity.ActivitySignupResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: 报名成功
        activity.ActivitySupplementAttendanceRequest:
            type: object
            properties:
                activityId:
                    type: string
                    description: '活动ID 必填 @gotags: json:"activityId,required"'
                volunteerId:
                    type: string
                    description: '志愿者ID（volunteers.id）必填 @gotags: json:"volunteerId,required"'
                checkInTime:
                    type: string
                    description: '补录签到时间（当原记录未签到时必填）格式: 2006-01-02 15:04:05 @gotags: json:"checkInTime"'
