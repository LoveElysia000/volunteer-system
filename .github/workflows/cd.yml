name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image metadata
        id: prep
        run: |
          OWNER_LOWER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LOWER}/volunteer-system"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.tag }}
            ${{ steps.prep.outputs.image }}:latest

  deploy:
    name: Deploy to k3s
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      # 集群 kubeconfig 内容（Settings → Secrets → KUBE_CONFIG）
      # 未配置时本 job 自动跳过
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      IMAGE: ghcr.io/loveelysia000/volunteer-system
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::warning::KUBE_CONFIG secret 未配置，跳过部署"
            exit 0
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply manifests
        run: |
          [ -z "$KUBE_CONFIG" ] && exit 0
          kubectl apply -f deploy/headlamp.yaml
          kubectl apply -k deploy/k8s/

      - name: Roll out new image
        run: |
          [ -z "$KUBE_CONFIG" ] && exit 0
          if ! kubectl -n volunteer-system get secret volunteer-secrets >/dev/null 2>&1 \
             || ! kubectl -n volunteer-system get secret ghcr-creds >/dev/null 2>&1; then
            echo "::warning::集群内 Secret（volunteer-secrets / ghcr-creds）尚未创建，应用暂时起不来。创建命令见 deploy/k8s/README.md，创建后 Pod 会自动恢复"
            exit 0
          fi
          kubectl -n volunteer-system set image deployment/volunteer-app \
            app=${IMAGE}:${GITHUB_SHA}
          kubectl -n volunteer-system rollout status deployment/volunteer-app --timeout=180s
