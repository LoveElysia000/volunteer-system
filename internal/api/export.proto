syntax = "proto3";

package exportapi;

import "google/api/annotations.proto";
import "google/api/client.proto";

option go_package = "volunteer-system/internal/api;api";

// 导出功能
service ExportService {
  option (google.api.default_host) = "0.0.0.0:8080";

  // ExportVolunteers 导出志愿者列表为 Excel 文件。
  rpc ExportVolunteers(ExportVolunteersRequest) returns (ExportVolunteersResponse) {
    option (google.api.http) = {
      post: "/api/admin/export/volunteers"
      body: "*"
    };
  }

  // ExportActivities 导出活动列表为 Excel 文件。
  rpc ExportActivities(ExportActivitiesRequest) returns (ExportActivitiesResponse) {
    option (google.api.http) = {
      post: "/api/admin/export/activities"
      body: "*"
    };
  }

  // ExportOpsReport 导出运营模板报表（周/月）。
  rpc ExportOpsReport(ExportOpsReportRequest) returns (ExportOpsReportResponse) {
    option (google.api.http) = {
      post: "/api/admin/export/ops-report"
      body: "*"
    };
  }
}

message ExportVolunteersRequest {
  // 可选导出志愿者ID列表 @gotags: json:"idList"
  repeated int64 idList = 1; // optional selected volunteer ids
  // 志愿者姓名关键字 @gotags: json:"keyword"
  string keyword = 2; // volunteer real_name keyword
  // 审核状态 0-未认证 1-审核中 2-已通过 3-已驳回 @gotags: json:"auditStatus"
  repeated int32 auditStatus = 3;
  // 状态 1-活跃 2-非活跃 3-其他 @gotags: json:"status"
  repeated int32 status = 4;
}

message ExportVolunteersResponse {}

message ExportActivitiesRequest {
  // 可选导出活动ID列表 @gotags: json:"idList"
  repeated int64 idList = 1; // optional selected activity ids
  // 活动关键字 @gotags: json:"keyword"
  string keyword = 2; // activity title/description keyword
  // 状态（0=不过滤） @gotags: json:"status"
  int32 status = 3; // 0 means no filter
  // 开始时间（可选），支持 YYYY-MM-DD 或 YYYY-MM-DD HH:MM:SS @gotags: json:"startFrom"
  string startFrom = 4; // format: 2006-01-02 or 2006-01-02 15:04:05
  // 结束时间（可选），支持 YYYY-MM-DD 或 YYYY-MM-DD HH:MM:SS @gotags: json:"startTo"
  string startTo = 5; // format: 2006-01-02 or 2006-01-02 15:04:05
}

message ExportActivitiesResponse {}

message ExportOpsReportRequest {
  // 周/月模板 必填 @gotags: json:"periodType,required"
  string periodType = 1; // weekly/monthly
  // 组织ID 必填 @gotags: json:"orgId,required"
  int64 orgId = 2;
  // 开始时间 可选，支持 YYYY-MM-DD 或 YYYY-MM-DD HH:MM:SS @gotags: json:"start"
  string start = 3; // format: 2006-01-02 or 2006-01-02 15:04:05
  // 结束时间 可选，支持 YYYY-MM-DD 或 YYYY-MM-DD HH:MM:SS @gotags: json:"end"
  string end = 4; // format: 2006-01-02 or 2006-01-02 15:04:05
}

message ExportOpsReportResponse {}
