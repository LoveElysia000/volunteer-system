syntax = "proto3";

package audit;

import "google/api/annotations.proto";
import "google/api/client.proto";

option go_package = "volunteer-system/internal/api;api";

// 审核服务：提供待审核列表、执行审核、审核记录查询等接口
service AuditService {
  option (google.api.default_host) = "0.0.0.0:8080";

  // 统一待审核列表（按目标类型筛选）
  rpc PendingAuditList(PendingAuditListRequest) returns (PendingAuditListResponse) {
    option (google.api.http) = {
      post: "/api/audits/pending"
      body: "*"
    };
  }

  // 执行审核通过动作
  rpc AuditApproval(AuditApprovalRequest) returns (AuditApprovalResponse) {
    option (google.api.http) = {
      post: "/api/audits/approval"
      body: "*"
    };
  }

  // 执行审核驳回动作
  rpc AuditRejection(AuditRejectionRequest) returns (AuditRejectionResponse) {
    option (google.api.http) = {
      post: "/api/audits/rejection"
      body: "*"
    };
  }

  // 批量审核决策（通过/驳回）
  rpc AuditBatchDecision(AuditBatchDecisionRequest) returns (AuditBatchDecisionResponse) {
    option (google.api.http) = {
      post: "/api/audits/batch-decision"
      body: "*"
    };
  }

  // 获取单条审核记录详情
  rpc AuditRecordDetail(AuditRecordDetailRequest) returns (AuditRecordDetailResponse) {
    option (google.api.http) = {
      get: "/api/audits/records/:id"
    };
  }
}

// 统一待审核列表查询参数
message PendingAuditListRequest {
  // 审核目标类型集合 @gotags: json:"targetTypes"
  repeated int32 targetTypes = 1;
  // 审核状态集合 @gotags: json:"status"
  repeated int32 status = 2;
  // 标题/副标题关键词 @gotags: json:"keyword"
  string keyword = 3;
  // 页码（从1开始） @gotags: json:"page"
  int32 page = 4;
  // 每页条数 @gotags: json:"pageSize"
  int32 pageSize = 5;
  // 创建时间起始（可选） @gotags: json:"createdFrom"
  string createdFrom = 6;
  // 创建时间结束（可选） @gotags: json:"createdTo"
  string createdTo = 7;
  // 超时阈值小时（可选，默认24） @gotags: json:"slaHours"
  int32 slaHours = 8;
}

// 统一待审核列表查询结果
message PendingAuditListResponse {
  // 总记录数
  int32 total = 1;
  // 当前页数据
  repeated PendingAuditItem list = 2;
}

// 统一待审核项
message PendingAuditItem {
  // 审核记录ID
  int64 id = 1;
  // 审核目标类型
  int32 targetType = 2;
  // 审核目标ID
  int64 targetId = 3;
  // 主标题
  string title = 4;
  // 副标题
  string subTitle = 5;
  // 提交人账号ID
  int64 creatorId = 6;
  // 创建时间
  string createdAt = 7;
  // 是否超时
  bool isOverdue = 8;
}

// 执行审核请求参数
message AuditApprovalRequest {
  // 审核记录id @gotags: json:"id,required"
  int64 id = 1;
  // 原因 @gotags: json:"reason"
  string reason = 2;
}

// 执行审核返回结果
message AuditApprovalResponse {
}

// 执行审核驳回请求参数
message AuditRejectionRequest {
  // 审核记录id @gotags: json:"id,required"
  int64 id = 1;
  // 原因 @gotags: json:"reason"
  string reason = 2;
}

// 执行审核驳回返回结果
message AuditRejectionResponse {
}

message AuditBatchDecisionRequest {
  // 审核记录ID列表 @gotags: json:"ids,required"
  repeated int64 ids = 1;
  // 动作: 1-通过 2-驳回 @gotags: json:"action,required"
  int32 action = 2;
  // 备注/原因 @gotags: json:"reason"
  string reason = 3;
}

message AuditBatchDecisionResponse {
  // 成功数量
  int32 successCount = 1;
  // 失败记录ID列表
  repeated int64 failedIds = 2;
}

// 审核记录详情查询参数
message AuditRecordDetailRequest {
  // 审核记录 ID @gotags: path:"id,required"
  int64 id = 1;
}

// 审核记录详情查询结果
message AuditRecordDetailResponse {
  // 审核记录详情
  AuditRecordDetail record = 1;
}

// 审核记录详情
message AuditRecordDetail {
  // 审核记录 ID
  int64 id = 1;
  // 审核目标类型
  int32 targetType = 2;
  // 审核目标 ID
  int64 targetId = 3;
  // 审核人 ID
  int64 auditorId = 4;
  // 审核状态
  int32 status = 5;
  // 审核前内容快照
  string oldContent = 6;
  // 审核后内容快照
  string newContent = 7;
  // 审核结果
  int32 auditResult = 8;
  // 驳回原因
  string rejectReason = 9;
  // 审核时间
  string auditTime = 10;
  // 记录创建时间
  string createdAt = 11;
}
