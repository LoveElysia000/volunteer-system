syntax = "proto3";

package volunteer;

import "google/api/annotations.proto";
import "google/api/client.proto";

option go_package = "volunteer-system/internal/api;api";

// 志愿者管理服务端接口
service VolunteerService {
  option (google.api.default_host) = "0.0.0.0:8080";

  // 志愿者列表（管理员端）
  rpc VolunteerList(VolunteerListRequest) returns (VolunteerListResponse) {
    option (google.api.http) = {
      post: "/api/volunteers/list"
      body: "*"
    };
  }

  // 志愿者详情（管理员端）
  rpc VolunteerDetail(VolunteerDetailRequest) returns (VolunteerDetailResponse) {
    option (google.api.http) = {
      get: "/api/volunteers/{volunteerId}"
    };
  }

  // 我的个人信息（志愿者端）
  rpc MyProfile(MyProfileRequest) returns (MyProfileResponse) {
    option (google.api.http) = {
      get: "/api/me/profile"
    };
  }

  // 志愿者首页摘要（志愿者端）
  rpc VolunteerHomeSummary(VolunteerHomeSummaryRequest) returns (VolunteerHomeSummaryResponse) {
    option (google.api.http) = {
      get: "/api/volunteers/home/summary"
    };
  }

  // 更新志愿者信息（志愿者端）
  rpc VolunteerUpdate(VolunteerUpdateRequest) returns (VolunteerUpdateResponse) {
    option (google.api.http) = {
      put : "/api/me/volunteer-profile"
      body: "*"
    };
  }

  // 更新志愿者账户信息（志愿者端）
  rpc VolunteerAccountUpdate(VolunteerAccountUpdateRequest) returns (VolunteerAccountUpdateResponse) {
    option (google.api.http) = {
      put : "/api/me/account"
      body: "*"
    };
  }

  // 提交志愿者实名认证申请（走审核流）
  rpc VolunteerRealNameSubmit(VolunteerRealNameSubmitRequest) returns (VolunteerRealNameSubmitResponse) {
    option (google.api.http) = {
      post: "/api/volunteers/real-name/submit"
      body: "*"
    };
  }
}

// VolunteerListRequest 志愿者列表请求（管理员端）
message VolunteerListRequest {
  // 搜索关键字 可选 @gotags: json:"keyword"
  string keyword = 1;
  // 页码 必填 @gotags: json:"page"
  int32 page = 2;
  // 页大小 必填 @gotags: json:"pageSize"
  int32 pageSize = 3;
}

// VolunteerListResponse 志愿者列表响应
message VolunteerListResponse {
  int32                      total = 1;
  repeated VolunteerListItem list  = 2;
}

// VolunteerListItem 志愿者列表项
message VolunteerListItem {
  int64 id = 1;
  // 账户ID
  int64 accountId = 2;
  // 真实姓名
  string realName = 3;
  // 性别: 0-未知, 1-男, 2-女
  int32 gender = 4;
  // 头像URL
  string avatarUrl = 5;
  // 累计服务时长(小时)
  double totalHours = 6;
  // 累计服务次数
  int32 serviceCount = 7;
  // 信用分
  int32 creditScore = 8;
  // 实名认证状态: 0-未认证, 1-审核中, 2-已通过, 3-驳回
  int32 auditStatus = 9;
  // 创建时间
  string createdAt = 10;
  // 更新时间
  string updatedAt = 11;
  // 志愿者状态
  int32 status = 12;
}

// VolunteerDetailRequest 志愿者详情请求
message VolunteerDetailRequest {
  // 志愿者ID 必填 @gotags: path:"volunteerId,required"
  int64 volunteerId = 1;
}

// VolunteerDetailResponse 志愿者详情响应（管理员端）
message VolunteerDetailResponse {
  // 志愿者信息
  VolunteerInfo volunteer = 1;
}

// MyProfileRequest 我的个人信息请求（志愿者端）
message MyProfileRequest {}

// MyProfileResponse 我的个人信息响应（志愿者端）
message MyProfileResponse {
  // 志愿者信息
  VolunteerInfo volunteer = 1;
  // 账户信息
  VolunteerAccountInfo accountInfo = 2;
  // 个人资料
  VolunteerProfileInfo profile = 3;
  // 实名认证信息
  VolunteerVerificationInfo verification = 4;
}

// VolunteerHomeSummaryRequest 志愿者首页摘要请求（志愿者端）
message VolunteerHomeSummaryRequest {}

// VolunteerHomeSummaryResponse 志愿者首页摘要响应（志愿者端）
message VolunteerHomeSummaryResponse {
  // 昵称
  string nickname = 1;
  // 当前等级ID
  int32 level = 2;
  // 统计信息
  VolunteerHomeSummaryStats stats = 3;
  // 本月成长值（工时增量）
  double monthlyGrowth = 4;
  // 距离下一等级还需工时
  double needHoursToNextLevel = 5;
}

// VolunteerHomeSummaryStats 首页统计信息
message VolunteerHomeSummaryStats {
  // 总积分
  int32 points = 1;
  // 总工时
  double hours = 2;
  // 活动参与次数
  int32 activityCount = 3;
}

// VolunteerInfo 志愿者信息
message VolunteerInfo {
  int64 id = 1;
  // 账户ID
  int64 accountId = 2;
  // 真实姓名
  string realName = 3;
  // 性别: 0-未知, 1-男, 2-女
  int32 gender = 4;
  // 出生日期
  string birthday = 5;
  // 身份证号
  string idCard = 6;
  // 头像URL
  string avatarUrl = 7;
  // 个人简介
  string introduction = 8;
  // 累计服务时长(小时)
  double totalHours = 9;
  // 累计服务次数
  int32 serviceCount = 10;
  // 信用分
  int32 creditScore = 11;
  // 实名认证状态: 0-未认证, 1-审核中, 2-已通过, 3-驳回
  int32 auditStatus = 12;
  // 创建时间
  string createdAt = 13;
  // 更新时间
  string updatedAt = 14;
  // 志愿者状态
  int32 status = 15;
}

// VolunteerAccountInfo 志愿者账户信息
message VolunteerAccountInfo {
  // 用户名
  string userName = 1;
  // 邮箱
  string email = 2;
  // 手机号
  string phone = 3;
}

// VolunteerProfileInfo 志愿者个人资料
message VolunteerProfileInfo {
  // 性别: 0-未知, 1-男, 2-女
  int32 gender = 1;
  // 出生日期
  string birthday = 2;
  // 头像URL
  string avatarUrl = 3;
  // 个人简介
  string introduction = 4;
}

// VolunteerVerificationInfo 志愿者实名认证信息
message VolunteerVerificationInfo {
  // 真实姓名
  string realName = 1;
  // 身份证号
  string idCard = 2;
  // 实名认证状态: 0-未认证, 1-审核中, 2-已通过, 3-驳回
  int32 auditStatus = 3;
}

// VolunteerUpdateRequest 更新志愿者请求
message VolunteerUpdateRequest {
  // 性别: 0-未知, 1-男, 2-女 可选 @gotags: json:"gender"
  int32 gender = 1;
  // 出生日期 可选 @gotags: json:"birthday"
  string birthday = 2;
  // 头像URL 可选 @gotags: json:"avatarUrl"
  string avatarUrl = 3;
  // 个人简介 可选 @gotags: json:"introduction"
  string introduction = 4;
}

// VolunteerUpdateResponse 更新志愿者响应
message VolunteerUpdateResponse {}

// VolunteerAccountUpdateRequest 更新志愿者账户信息请求
message VolunteerAccountUpdateRequest {
  // 用户名 可选 @gotags: json:"userName"
  string userName = 1;
  // 邮箱 可选 @gotags: json:"email"
  string email = 2;
  // 手机号 可选 @gotags: json:"phone"
  string phone = 3;
}

// VolunteerAccountUpdateResponse 更新志愿者账户信息响应
message VolunteerAccountUpdateResponse {}

// VolunteerRealNameSubmitRequest 志愿者实名认证提审请求
message VolunteerRealNameSubmitRequest {
  // 真实姓名 @gotags: json:"realName"
  string realName = 1;
  // 身份证号 @gotags: json:"idCard"
  string idCard = 2;
}

// VolunteerRealNameSubmitResponse 志愿者实名认证提审响应
message VolunteerRealNameSubmitResponse {
  // 审核记录ID
  int64 auditId = 1;
  // 审核状态: 1-待审核
  int32 status = 2;
}

// BaseVolunteer 基础志愿者信息（用于其他服务引用）
message BaseVolunteer {
  // 志愿者姓名
  string name = 1;
  // 志愿者编号
  string volunteerCode = 2;
  // 手机号
  string phone = 3;
  // 邮箱
  string email = 4;
  // 性别
  string gender = 5;
  // 志愿者状态
  string status = 6;
  // 状态名称
  string statusName = 7;
  // 创建时间
  string joinDate = 8;
  // 退出时间
  string leaveDate = 9;
}
